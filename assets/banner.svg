<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="bt bd">
  <title id="bt">yfnhanced-mcp — enterprise-grade Yahoo Finance data for AI agents</title>
  <desc id="bd">Hero card: brand mark and wordmark, capability chips, and the MCP client configuration snippet.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6D6BF2"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A14"/>
      <stop offset="0.5" stop-color="#12101F"/>
      <stop offset="1" stop-color="#151027"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.18" cy="0.1" r="0.65">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.88" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2E2748" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1280" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <rect width="1280" height="420" fill="url(#glowV)"/>
    <rect width="1280" height="420" fill="url(#glowC)"/>

    <!-- faint candlestick watermark -->
    <g stroke="#8B5CF6" stroke-opacity="0.10" stroke-width="3" fill="#8B5CF6" fill-opacity="0.07">
      <line x1="980" y1="330" x2="980" y2="400"/><rect x="968" y="348" width="24" height="34" rx="4"/>
      <line x1="1050" y1="300" x2="1050" y2="392"/><rect x="1038" y="318" width="24" height="48" rx="4"/>
      <line x1="1120" y1="268" x2="1120" y2="376"/><rect x="1108" y="286" width="24" height="62" rx="4"/>
      <line x1="1190" y1="236" x2="1190" y2="360"/><rect x="1178" y="254" width="24" height="76" rx="4"/>
    </g>

    <!-- brand mark (inline copy of assets/logo.svg) -->
    <g transform="translate(56,56) scale(1.5)">
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15" fill="url(#brand)"/>
      <g fill="#0A0A14" fill-opacity="0.82">
        <rect x="12" y="36" width="8.5" height="15" rx="2.5"/>
        <rect x="25" y="28" width="8.5" height="23" rx="2.5"/>
        <rect x="38" y="19" width="8.5" height="32" rx="2.5"/>
      </g>
      <path d="M14.5 31.5 L29.25 22 L42.25 13.5 L50 12" fill="none" stroke="#F5F3FB" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="50" cy="12" r="4.6" fill="#F5F3FB"/>
    </g>

    <text x="176" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="54" font-weight="700" fill="#F5F3FB" letter-spacing="-1">yfnhanced-mcp</text>
    <rect x="178" y="124" width="396" height="5" rx="2.5" fill="url(#brand)"/>
    <text x="178" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="21" fill="#A79FC0">Enterprise-grade Yahoo Finance data for AI agents</text>

    <!-- stat pills -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">
      <g>
        <rect x="56" y="196" width="136" height="38" rx="19" fill="#1B1630" stroke="#2E2748"/>
        <circle cx="78" cy="215" r="4.5" fill="#22D3EE"/>
        <text x="92" y="220" fill="#A79FC0">17 MCP tools</text>
      </g>
      <g>
        <rect x="204" y="196" width="112" height="38" rx="19" fill="#1B1630" stroke="#2E2748"/>
        <circle cx="226" cy="215" r="4.5" fill="#8B5CF6"/>
        <text x="240" y="220" fill="#A79FC0">6 prompts</text>
      </g>
      <g>
        <rect x="328" y="196" width="122" height="38" rx="19" fill="#1B1630" stroke="#2E2748"/>
        <circle cx="350" cy="215" r="4.5" fill="#8B5CF6"/>
        <text x="364" y="220" fill="#A79FC0">6 resources</text>
      </g>
      <g>
        <rect x="462" y="196" width="128" height="38" rx="19" fill="#1B1630" stroke="#2E2748"/>
        <circle cx="484" cy="215" r="4.5" fill="#34D399"/>
        <text x="498" y="220" fill="#A79FC0">4 test layers</text>
      </g>
    </g>

    <!-- capability chips -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#A79FC0">
      <g>
        <rect x="56" y="250" width="132" height="34" rx="17" fill="#151027" stroke="#2E2748"/>
        <text x="76" y="272">circuit breaker</text>
      </g>
      <g>
        <rect x="200" y="250" width="118" height="34" rx="17" fill="#151027" stroke="#2E2748"/>
        <text x="220" y="272">rate limiting</text>
      </g>
      <g>
        <rect x="330" y="250" width="124" height="34" rx="17" fill="#151027" stroke="#2E2748"/>
        <text x="350" y="272">retry + jitter</text>
      </g>
      <g>
        <rect x="466" y="250" width="76" height="34" rx="17" fill="#151027" stroke="#2E2748"/>
        <text x="486" y="272">cache</text>
      </g>
      <g>
        <rect x="56" y="296" width="176" height="34" rx="17" fill="#151027" stroke="#2E2748"/>
        <text x="76" y="318">stale-while-revalidate</text>
      </g>
      <g>
        <rect x="244" y="296" width="168" height="34" rx="17" fill="#151027" stroke="#2E2748"/>
        <text x="264" y="318">data quality scoring</text>
      </g>
      <g>
        <rect x="424" y="296" width="124" height="34" rx="17" fill="#151027" stroke="#2E2748"/>
        <text x="444" y="318">chaos-tested</text>
      </g>
    </g>

    <text x="58" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="14" fill="#6E678A">stdio transport  ·  Node &#8805; 18  ·  MIT</text>

    <!-- config card -->
    <g>
      <rect x="740" y="56" width="484" height="308" rx="16" fill="#12101F" stroke="#2E2748"/>
      <circle cx="768" cy="86" r="5.5" fill="#FB7185"/>
      <circle cx="788" cy="86" r="5.5" fill="#FBBF24"/>
      <circle cx="808" cy="86" r="5.5" fill="#34D399"/>
      <text x="830" y="91" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
            font-size="13" fill="#6E678A">claude_desktop_config.json</text>
      <line x1="740" y1="108" x2="1224" y2="108" stroke="#2E2748"/>
      <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5">
        <text x="768" y="142" fill="#A79FC0">{</text>
        <text x="788" y="168" fill="#22D3EE">"mcpServers"</text><text x="884" y="168" fill="#A79FC0">: {</text>
        <text x="808" y="194" fill="#22D3EE">"yfnhanced"</text><text x="896" y="194" fill="#A79FC0">: {</text>
        <text x="828" y="220" fill="#22D3EE">"command"</text><text x="904" y="220" fill="#A79FC0">: </text><text x="916" y="220" fill="#34D399">"npx"</text><text x="956" y="220" fill="#A79FC0">,</text>
        <text x="828" y="246" fill="#22D3EE">"args"</text><text x="876" y="246" fill="#A79FC0">: [</text><text x="904" y="246" fill="#34D399">"-y"</text><text x="936" y="246" fill="#A79FC0">, </text><text x="950" y="246" fill="#34D399">"yfnhanced-mcp"</text><text x="1070" y="246" fill="#A79FC0">]</text>
        <text x="808" y="272" fill="#A79FC0">}</text>
        <text x="788" y="298" fill="#A79FC0">}</text>
        <text x="768" y="324" fill="#A79FC0">}</text>
      </g>
    </g>
  </g>
</svg>
